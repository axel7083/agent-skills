# Included by the image (postgresql-cfg/*.conf). The certificate is the Service's serving
# certificate, signed and rotated by OpenShift's service CA.
ssl = on
ssl_cert_file = '/etc/postgresql-tls/tls.crt'
ssl_key_file = '/etc/postgresql-tls/tls.key'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = 'scram-sha-256'
logging_collector = off
log_destination = 'stderr'
