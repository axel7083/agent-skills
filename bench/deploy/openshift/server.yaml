# The bench server: runs, keys, trials, statistics, the report and the raw-data API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-server
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: bench-server
spec:
  selector:
    app.kubernetes.io/name: bench-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-server
spec:
  # One instance: the sweeper and the per-run locks assume it (Postgres advisory locks cover restarts).
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bench-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench-server
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: bench-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/axel7083/agent-skills/bench-server
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bench-server-env
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bench-postgres
                  key: bench-password
            # TLS to Postgres, its certificate checked against OpenShift's service CA.
            - name: DATABASE_URL
              value: postgres://bench:$(DB_PASSWORD)@bench-postgres:5432/bench?sslmode=verify-full&sslrootcert=/etc/bench-ca/service-ca.crt
            - name: BIFROST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bench-bifrost
                  key: admin-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: prices
              mountPath: /etc/bench
              readOnly: true
            - name: service-ca
              mountPath: /etc/bench-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: prices
          configMap:
            name: bench-prices
        - name: service-ca
          configMap:
            name: bench-service-ca
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
