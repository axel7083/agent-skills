# The bench edge: the OpenShift router terminates TLS, this proxy holds the routing contract, the
# only paths the internet reaches. Bifrost's admin API, UI and every other route stay internal.
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  upstream server {
    server bench-server:8080;
  }
  upstream bifrost {
    server bench-bifrost:8080;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";

  server {
    listen 8080 default_server;
    server_name _;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The bench workflow's endpoints (GitHub OIDC), the public report and raw-data API.
    location ^~ /v1/runs {
      client_max_body_size 2m;
      proxy_read_timeout 120s;
      proxy_pass http://server;
    }
    location ^~ /api/v1/ {
      if ($request_method != GET) { return 405; }
      proxy_pass http://server;
    }
    location ^~ /runs/ {
      if ($request_method != GET) { return 405; }
      proxy_pass http://server;
    }
    location ^~ /assets/ {
      if ($request_method != GET) { return 405; }
      proxy_pass http://server;
    }

    # Agents' LLM traffic to Bifrost: exact routes only (location = matches the normalised path),
    # each passed to its canonical path. Streams pass through as they come.
    location = /llm/anthropic/v1/messages {
      if ($request_method != POST) { return 404; }
      client_max_body_size 32m;
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://bifrost/anthropic/v1/messages;
    }
    location = /llm/anthropic/v1/messages/count_tokens {
      if ($request_method != POST) { return 404; }
      client_max_body_size 32m;
      proxy_pass http://bifrost/anthropic/v1/messages/count_tokens;
    }
    location = /llm/anthropic/v1/models {
      if ($request_method != GET) { return 404; }
      proxy_pass http://bifrost/anthropic/v1/models;
    }
    location = /llm/v1/chat/completions {
      if ($request_method != POST) { return 404; }
      client_max_body_size 32m;
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://bifrost/v1/chat/completions;
    }
    location = /llm/v1/responses {
      if ($request_method != POST) { return 404; }
      client_max_body_size 32m;
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://bifrost/v1/responses;
    }
    location = /llm/v1/models {
      if ($request_method != GET) { return 404; }
      proxy_pass http://bifrost/v1/models;
    }

    location / {
      return 404;
    }
  }

  # Probes only: no Service port points here.
  server {
    listen 8081;
    access_log off;
    location = /healthz {
      return 200;
    }
  }
}
