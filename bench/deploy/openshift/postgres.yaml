# Postgres: the bench server's runs, keys and trials (database bench) and Bifrost's store (database
# bifrost). Red Hat's image as a single-replica StatefulSet; its hooks (postgres/) add the bifrost
# role and database, TLS and TLS-only logins.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: bench-postgres
  annotations:
    # OpenShift's service CA issues (and rotates) the certificate for bench-postgres.<ns>.svc.
    service.beta.openshift.io/serving-cert-secret-name: bench-postgres-tls
spec:
  selector:
    app.kubernetes.io/name: bench-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# The service CA's bundle, injected by OpenShift: what clients verify the serving certificate against.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-service-ca
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bench-postgres
spec:
  serviceName: bench-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bench-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench-postgres
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: bench-postgres
      automountServiceAccountToken: false
      # A smart shutdown lets Bifrost's flushes finish.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: registry.redhat.io/rhel10/postgresql-18@sha256:de4c56c764fb11859e9862f7ffdeb963bd6754879093465cfe69fff54a723f17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: bench
            - name: POSTGRESQL_DATABASE
              value: bench
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bench-postgres
                  key: bench-password
            - name: BIFROST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bench-postgres
                  key: bifrost-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [/usr/libexec/check-container]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/usr/libexec/check-container]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/libexec/check-container, --live]
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            # The image writes its generated settings and passwd file to HOME, and its socket to /var/run.
            - name: home
              mountPath: /var/lib/pgsql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/postgresql-tls
              readOnly: true
            - name: config
              mountPath: /opt/app-root/src/postgresql-cfg
              readOnly: true
            - name: start-hooks
              mountPath: /opt/app-root/src/postgresql-start
              readOnly: true
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tls
          secret:
            secretName: bench-postgres-tls
            # Postgres accepts a root-owned key readable by its group (the pod's fsGroup), nothing wider.
            defaultMode: 0640
        - name: config
          configMap:
            name: bench-postgres-config
            items:
              - key: bench.conf
                path: bench.conf
        - name: start-hooks
          configMap:
            name: bench-postgres-config
            items:
              - key: bench.sh
                path: bench.sh
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3-csi
        resources:
          requests:
            storage: 10Gi
