# The server follows main: bench-server.yml pushes `:main`, the cluster re-imports it on its own
# schedule (about every 15 minutes), and the image trigger on deployment/bench-server rolls it out.
# Pods pull the digest straight from ghcr.io (referencePolicy Source); the history of imported
# digests is the rollback list.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: bench-server
spec:
  lookupPolicy:
    local: false
  tags:
    - name: main
      from:
        kind: DockerImage
        name: ghcr.io/axel7083/agent-skills/bench-server:main
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Source
