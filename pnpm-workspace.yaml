packages:
  - bench/*

# Supply chain: a version must be public for 3 days before we install it (Dependabot's cooldown matches).
minimumReleaseAge: 4320

catalog:
  # Contracts
  zod: 4.6.6
  yaml: 2.9.1
  # Report
  vega: 6.4.0
  vega-lite: 6.5.0
  vega-embed: 7.3.0
  vega-interpreter: 2.3.2
  esbuild: 0.28.2
  # Server: framework
  "@nestjs/common": 12.5.0
  "@nestjs/core": 12.5.0
  "@nestjs/platform-node": 12.5.0
  "@nestjs/schedule": 12.0.4
  "@nestjs/throttler": 6.7.1
  "@nestjs/swagger": 12.1.2
  "@nestjs/testing": 12.5.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  # Server: data
  "@nestjs/drizzle": 0.0.2
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  pg: 8.23.1
  "@types/pg": 8.23.1
  p-retry: 9.0.0
  # Server: GitHub OIDC, logging
  jose: 6.2.17
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  # OpenAPI clients, generated from the server's document
  "@hey-api/openapi-ts": 0.99.0
  # Server: tests
  "@testcontainers/postgresql": 12.2.1
  msw: 3.0.5
  unplugin-swc: 2.0.0
  "@swc/core": 1.16.22
  # Tooling
  typescript: 6.0.3
  "@types/node": 24.19.2
  eslint: 10.12.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.71.1
  vitest: 5.0.4

allowBuilds:
  "@scarf/scarf": false
  "@swc/core": true
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
