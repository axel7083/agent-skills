name: bench-sandbox

# Publishes the image agents work in. Pin the digest it prints in bench/sandbox/image.lock: runs use
# that digest, never a tag.
on:
  push:
    branches: [main]
    paths: [bench/sandbox/**]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build and push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/bench-sandbox"
          podman build --format docker -t "$image:$SHA" bench/sandbox
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$REGISTRY_USER" --password-stdin
          podman push --digestfile digest "$image:$SHA"
          echo "Pin in bench/sandbox/image.lock: \`$image:$SHA@$(cat digest)\`" >> "$GITHUB_STEP_SUMMARY"
