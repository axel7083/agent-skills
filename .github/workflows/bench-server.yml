name: bench-server

# Publishes the bench server's image as `:main`. The cluster's bench-server ImageStream imports it on
# its own schedule and rolls the server out (bench/deploy/openshift/server-imagestream.yaml).
on:
  push:
    branches: [main]
    paths: [bench/server/**, bench/server-client/**, bench/report/**, pnpm-lock.yaml]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "registry=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: bench-server
          tags: main sha-${{ github.sha }}
          containerfiles: bench/server/Containerfile
          context: .
          # Docker format: OCI images drop HEALTHCHECK.
          oci: false
          build-args: |
            REVISION=${{ github.sha }}
      - uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ steps.registry.outputs.registry }}
      - env:
          IMAGE: ${{ steps.registry.outputs.registry }}/bench-server
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Pushed \`$IMAGE:main@$DIGEST\`: the cluster imports it and rolls the server out." >> "$GITHUB_STEP_SUMMARY"
