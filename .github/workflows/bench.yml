name: bench
run-name: "bench · ${{ inputs.skill }} · ${{ inputs.trials }} trials"

# Measures one skill: the same tasks with and without it, on every harness × model cell. Manual
# only, from main. Each job runs in its own GitHub environment, and the bench server lets each
# environment call its own endpoints only (docs/benchmark.md "Trust"): the agent job, where the
# agent may be root, can mint and revoke its run's keys and nothing else.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to evaluate (bench/evals/<skill>.yaml)
        required: true
        default: containerfile-best-practices
        type: string
      cells:
        description: 'Harness × model cells, JSON: [{"harness":"opencode","model":"..."}]'
        required: true
        type: string
      trials:
        description: Trials per task, arm and cell
        required: true
        default: 5
        type: number
      max-usd:
        description: Spending cap for the whole run (the server caps it too)
        required: true
        default: 40
        type: number

permissions: {}

concurrency:
  group: bench
  cancel-in-progress: false

env:
  BENCH_SERVER_URL: ${{ vars.BENCH_SERVER_URL }}
  RUNNER: node --conditions=@podman-desktop/agent-skills-source bench/runner/src/cli.ts

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: bench-plan
    permissions:
      id-token: write
      contents: read
    outputs:
      run-id: ${{ steps.plan.outputs.run-id }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @podman-desktop/agent-skills-bench-runner...
      - run: pnpm --filter @podman-desktop/agent-skills-bench-server-client build
      - id: plan
        env:
          SKILL: ${{ inputs.skill }}
          CELLS: ${{ inputs.cells }}
          TRIALS: ${{ inputs.trials }}
          MAX_USD: ${{ inputs.max-usd }}
        run: $RUNNER plan --server "$BENCH_SERVER_URL" --skill "$SKILL" --cells "$CELLS" --trials "$TRIALS" --max-usd "$MAX_USD"

  agent:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    environment: bench-agent
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: agent · ${{ matrix.shard.id }} · ${{ matrix.shard.model }} · ${{ matrix.shard.arm }} · ${{ matrix.shard.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @podman-desktop/agent-skills-bench-runner...
      - run: pnpm --filter @podman-desktop/agent-skills-bench-server-client build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - name: install Harbor (hash-locked)
        run: |
          uv venv "$RUNNER_TEMP/harbor"
          uv pip install --python "$RUNNER_TEMP/harbor/bin/python" --require-hashes --no-deps -r bench/runner/requirements.txt
      - name: rootless Podman API for Harbor's compose
        run: |
          systemctl --user start podman.socket
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> "$GITHUB_ENV"
      - name: run the agent
        env:
          RUN_ID: ${{ needs.plan.outputs.run-id }}
          SKILL: ${{ inputs.skill }}
          SHARD: ${{ toJSON(matrix.shard) }}
          TRIALS: ${{ inputs.trials }}
        run: $RUNNER agent --server "$BENCH_SERVER_URL" --run "$RUN_ID" --skill "$SKILL" --shard "$SHARD" --trials "$TRIALS" --harbor "$RUNNER_TEMP/harbor/bin/harbor" --out "$RUNNER_TEMP/out"
      # Public once uploaded: the key in it was revoked and redacted before this step.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-${{ matrix.shard.id }}
          path: ${{ runner.temp }}/out
          retention-days: 30
          if-no-files-found: ignore
          include-hidden-files: true

  grade:
    needs: [plan, agent]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # No environment, no id-token: this job builds and runs what the agent wrote.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: grade · ${{ matrix.shard.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @podman-desktop/agent-skills-bench-runner...
      - run: pnpm --filter @podman-desktop/agent-skills-bench-server-client build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-${{ matrix.shard.id }}
          path: ${{ runner.temp }}/agent
      - name: grade
        env:
          SKILL: ${{ inputs.skill }}
          SHARD: ${{ toJSON(matrix.shard) }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/graded"
          $RUNNER grade --skill "$SKILL" --shard "$SHARD" --attempt "$ATTEMPT" --in "$RUNNER_TEMP/agent" --out "$RUNNER_TEMP/graded/trials.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graded-${{ matrix.shard.id }}
          path: ${{ runner.temp }}/graded
          retention-days: 30

  complete:
    needs: [plan, grade]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: bench-upload
    permissions:
      id-token: write
      contents: read
      actions: read # the run's artifact ids, for the links the server publishes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @podman-desktop/agent-skills-bench-runner...
      - run: pnpm --filter @podman-desktop/agent-skills-bench-server-client build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: graded-*
          path: ${{ runner.temp }}/graded
      - name: upload the trials and complete the run
        env:
          RUN_ID: ${{ needs.plan.outputs.run-id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: $RUNNER complete --server "$BENCH_SERVER_URL" --run "$RUN_ID" --in "$RUNNER_TEMP/graded"
